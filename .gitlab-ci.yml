variables:
  # Carpeta donde mkdocs deja la web generada.
  # OJO: debe coincidir con `site_dir` de Repo/_doc/mkdocs/base.yml
  DOC_DIR: "_doc/Datasheet"

pages:
  stage: deploy
  script:
    - mkdir public
    - cp -r "$DOC_DIR"/* public/
  artifacts:
    paths:
      - public
  rules:
    # Se publica desde la rama por defecto de GitLab (hoy: Submodule)
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
