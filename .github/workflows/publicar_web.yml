# =============================================================================
# Publica el manual de usuario en GitHub Pages
#   https://tonydiana.github.io/PyOECF/ (ver README.md)
#
# Cada vez que Remoto.sh sube la rama de despliegue, sube TAL CUAL la carpeta
# del manual ya generado (no ejecuta MkDocs ni Jekyll: no hace falta
# .nojekyll). Su contenido pasa a ser la raíz de la web.
#
# En GitHub: Settings → Pages → Source = "GitHub Actions".
# =============================================================================

name: Publicar web

on:
  push:
    # --- OJO: mismo valor que RAMA_DESTINO en rec/scripts/remoto.conf
    branches: [deploy]
  # --- Permite lanzarlo a mano desde la pestaña Actions
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# --- Una publicación cada vez; si llega otra, espera (no cancela la que va)
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}

    steps:
      - name: Descargar el repo
        uses: actions/checkout@v7

      - name: Preparar Pages
        uses: actions/configure-pages@v6

      - name: Empaquetar el manual
        uses: actions/upload-pages-artifact@v5
        with:
          # --- OJO: mismo destino que site_dir en doc/src_manual/mkdocs.yml
          path: doc/Manual

      - name: Publicar
        id: despliegue
        uses: actions/deploy-pages@v5
