# ============================================================================
# Configuración de requirements.sh (formato bash) — PyOECF
#
# ÚNICA fuente de los requerimientos PROPIOS de este proyecto: los que no
# vienen de ninguna biblioteca vendorizada en src/bib/. requirements.sh los
# combina con lo que descubre en cada BIB_REAL_slr.
#
# Cada lista va en un bloque "heredoc": lo que hay entre <<"FIN" y FIN se
# copia TAL CUAL (formato requirements.txt de pip, comentarios incluidos).
# No hacen falta comillas por línea: ">", "<" o "$" no se interpretan.
# ============================================================================

# cSpell:ignore appkit, aquila, biboecf, customtkinter, matplotlib, numpy, pyinstaller, pyobjc, pystray, pyyaml, rawpy, screeninfo, tifffile, tkinter, venv, xlsxwriter

# --- Ruta del venv, relativa a la raíz del repo
#     ".venv"   → dentro del repo (debe estar en .gitignore)
#     "../venv" → carpeta hermana del repo
RUTA_VENV=".venv"


# --- pip, DESPLIEGUE
DESPLIEGUE="$(cat <<"FIN"
# --- El análisis (src/biboecf: desde el 2026-10-16 es parte de PyOECF,
#     no una biblioteca aparte; antes los declaraba su requirements.conf).
#     De Std solo queda src/bib/clases_slr.py, que no necesita nada
# --- Lectura de los RAW: ajustes, dimensiones, patrón de color
rawpy~=0.27

# --- Cálculo numérico
numpy~=2.5

# --- Libro Excel de resultados (licencia BSD)
XlsxWriter~=3.2

# --- Láminas PSD de 16 bits (licencia MIT; trae Pillow)
psd-tools~=1.24

# --- Exportaciones del revelador en TIFF de 16 bits (licencia BSD)
tifffile>=2025.1

# --- Ficha PDF de la cámara: gráficas y páginas (licencia de Matplotlib,
#     tipo BSD). Unos 16 MB más en un ejecutable de un solo archivo
matplotlib~=3.11

# --- Parte gráfica (sin icono en la bandeja: no hace falta pystray)
customtkinter~=6.0

# --- Posición de cada monitor, para centrar la ventana en el principal
#     (Tk ve todos los monitores como una sola pantalla). En macOS la lee
#     con AppKit, que viene en pyobjc-framework-Cocoa
screeninfo~=0.8.1
pyobjc-framework-Cocoa; sys_platform == "darwin"
FIN
)"


# --- pip, DESARROLLO (se instala además de DESPLIEGUE, con --dev)
DESARROLLO="$(cat <<"FIN"
# --- Ejecutables para Windows, macOS y Linux. GPLv2 con excepción: los
#     ejecutables generados pueden tener cualquier licencia
pyinstaller~=6.22
FIN
)"


# --- apt, SISTEMA: lo no instalable vía pip. Se instala ANTES de crear el
#     venv. python3-venv no va aquí: lo instala siempre el propio script.
#     Si aparece python3-gi, el script enlaza gi dentro del venv.
SISTEMA="$(cat <<"FIN"
# --- tkinter para el Python del sistema (customtkinter lo necesita al
#     importarse, no al instalarse: pip no avisa si falta). "python3-tk"
#     sigue la versión de Python por defecto, sin fijarla aquí.
python3-tk
FIN
)"
