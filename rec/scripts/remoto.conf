# Configuración de Remoto.sh (formato bash) — PyOECF

URL_REMOTO="git@github.com:TonyDiana/PyOECF.git"

REMOTO="GitHub"
RAMA_ORIGEN="master"
# --- OJO: mismo valor que "branches" en .github/workflows/publicar_web.yml
RAMA_DESTINO="deploy"

# --- "" si el repo no tiene VERSION: el commit usa el hash de origen
ARCHIVO_VERSION="VERSION"

# --- Dependencias pip en la raíz de RAMA_DESTINO, generadas desde
#     rec/requirements/requirements.conf (para GitHub y los workflows).
#     Solo existe en RAMA_DESTINO, nunca en RAMA_ORIGEN. "" → no se genera
ARCHIVO_REQUIREMENTS="requirements.txt"

# --- Rutas que no se despliegan (relativas a la raíz).
#     Obligatoria; si no hay nada que quitar: REMOVE_PATHS=()
REMOVE_PATHS=(
    ".vscode"
    "doc/src_dev"
    "doc/src_manual"
    "doc/Datasheet"
    "rec"
    ".gitignore"
    "index.html"
    "src/bib/bib_slr.sh"
)
